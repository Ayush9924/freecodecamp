<!DOCTYPE html>

<html>
  <head>
    <title>File Metadata</title>
    <link
      rel="shortcut icon"
      href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
      type="text/css"
    />
    <link href="/public/style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div class="container">
      <h2>API Project: File Metadata Microservice</h2>

      <h3>Usage:</h3>
      <p>Please Upload a File ...</p>
      <div class="view">
        <h4 id="output"></h4>
        <form
          id="fileForm"
          enctype="multipart/form-data"
          method="POST"
          action="/api/fileanalyse"
        >
          <input id="inputfield" type="file" name="upfile" required />
          <input id="button" type="submit" value="Upload" />
        </form>
      </div>
    </div>
    <script>
      document.getElementById('fileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        try {
          const response = await fetch('/api/fileanalyse', {
            method: 'POST',
            body: formData
          });
          const data = await response.json();
          document.getElementById('output').textContent = JSON.stringify(data);
        } catch (error) {
          document.getElementById('output').textContent = 'Error: ' + error.message;
        }
      });
    </script>
    <div class="footer">
      <p>
        by
        <a href="https://www.freecodecamp.org/Sk_Dev">Shehzad Khan</a>
      </p>
    </div>
  </body>
</html>
